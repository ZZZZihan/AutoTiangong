[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autotiangong"
version = "0.1.0"
description = "Authorized single-account campus portal auto-login demo."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
autotiangong-net = "autotiangong.daemon:main"

[tool.setuptools.packages.find]
where = ["src"]

